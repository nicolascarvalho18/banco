spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bancosapdb}
    username: ${SPRING_DATASOURCE_USERNAME:bancosap}
    password: ${SPRING_DATASOURCE_PASSWORD:bancosapsecret}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

bancosap:
  security:
    jwt:
      secret: ${JWT_SECRET:bW9kZXJuLWJhbmNvLXNhcC1zZWN1cmUtand0LXNlY3JldC1rZXktZXhhbXBsZS0yNTYtYml0cw==}
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
